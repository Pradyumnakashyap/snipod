[tool.poetry]
name = "snipod"
version = "0.1.0"
description = "Slim API to scale down a specific pod by name"
authors = ["Team CM3"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
kubernetes = ">=25.3,<32"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
isort = {version = "^5.13", extras = ["colors"]}
pytest = "^8.0"
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "-s -vv -W ignore::DeprecationWarning --cov=app --cov-report=term-missing"
