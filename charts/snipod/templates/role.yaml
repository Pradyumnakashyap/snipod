apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "snipod.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snipod.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "snipod.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snipod.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "snipod.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
